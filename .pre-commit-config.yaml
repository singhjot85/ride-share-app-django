exclude: "documentation|node_modules|.git|.agents|.github"
default_stages: [pre-commit, pre-push]
fail_fast: false

repos:

  # -------------------------------------------------------------
  # Ruff: High-performance Linter & Formatter (replaces Black, isort, Flake8)
  # -------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # Linter & autofixer (replaces flake8, isort, debug-statements, flake8-print)
      - id: ruff
        name: ruff-lint
        args: ["--fix"]

      # Code formatter (drop-in replacement for Black)
      - id: ruff-format
        name: ruff-format

  # General Pre-Commit hooks ensuring file consistency
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      # - id: debug-statements
      - id: mixed-line-ending

  # Validate Code complexity
  - repo: https://github.com/yunojuno/pre-commit-xenon
    rev: v0.1
    hooks:
      - id: xenon
        args: ["--max-average=B", "--max-modules=C", "--max-absolute=E"]

  # Formatter and linter for HTML templates
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-jinja
        name: djLint Formatter (Jinja)
        types_or: [html, jinja]
        args: ["--profile=jinja"]
      - id: djlint-jinja
        name: djLint Linter (Jinja)
      - id: djlint-reformat-django
        name: djLint Re-Formatter (Django)
        exclude: '^frontend/index\.html$'
      - id: djlint-django
        name: djLint Linter (Django)
        exclude: '^frontend/index\.html$'

  # Check for any secrete leak(s) inside repo
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
        exclude: '^(package-lock\.json|core/setup/.*\.json)$'

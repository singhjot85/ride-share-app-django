volumes:
  pg_data:
    name: ${STACK_NAME:-rideshare}_local_pg_data

services:
  ##############################
  ## Django Backend Service
  ##############################
  django: &Django
    build:
      context: ../../.
      dockerfile: compose/local/backend/django/Dockerfile
    container_name: ${STACK_NAME:-rideshare}_django
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ../../backend:/backend
      # - ./backend/scripts:/scripts
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DJANGO_DEBUG=True
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONPATH=/backend:/backend/core-common-django-apps
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - ENABLE_DEBUGPY=0
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    # TODO: Implement health-check once APIs are implemented
    # healthcheck:
    #   test: ["curl", "-u", ""]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 5s

  ##############################
  ## Postgres Database Service
  ##############################
  postgres:
    build:
      context: ./backend/postgres
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-rideshare}_postgres
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ##############################
  ## Redis Cache Service
  ##############################
  cache:
    image: valkey/valkey:8.1.5-alpine
    pull_policy: if_not_present
    container_name: ${STACK_NAME:-rideshare}_valkey_cache
    ports:
      - "${CACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ##############################
  ## Redis Broker Service
  ##############################
  broker:
    image: valkey/valkey:8.1.5-alpine
    pull_policy: if_not_present
    container_name: ${STACK_NAME:-rideshare}_valkey_broker
    command: valkey-server --port 6378 --appendonly yes
    ports:
      - "${BROKER_PORT:-6378}:6378"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6378", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ##############################
  ## Celery Worker Service
  ##############################
  celeryworker:
    <<: *Django
    command: /scripts/worker-start.sh
    container_name: ${STACK_NAME:-rideshare}_celeryworker
    ports:
      - "${CELERY_PORT:-5555}:5555"
    depends_on:
      django:
        condition: service_started
        # condition: service_healthy
      broker:
        condition: service_healthy

  ##############################
  ## Celery Beat Service
  ##############################
